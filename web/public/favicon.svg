<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- auris: a record at the centre with five directions radiating out -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#000"/>
  <circle cx="32" cy="32" r="28" fill="url(#glow)"/>
  <g stroke="#fff" stroke-width="2.4" stroke-linecap="round">
    <line x1="32" y1="18" x2="32" y2="6"/>
    <line x1="45.3" y1="27.7" x2="56.7" y2="24"/>
    <line x1="40.2" y1="43.3" x2="47.3" y2="53"/>
    <line x1="23.8" y1="43.3" x2="16.7" y2="53"/>
    <line x1="18.7" y1="27.7" x2="7.3" y2="24"/>
  </g>
  <g fill="#fff">
    <circle cx="32" cy="6" r="3"/>
    <circle cx="56.7" cy="24" r="3"/>
    <circle cx="47.3" cy="53" r="3"/>
    <circle cx="16.7" cy="53" r="3"/>
    <circle cx="7.3" cy="24" r="3"/>
  </g>
  <circle cx="32" cy="32" r="11" fill="#fff"/>
  <circle cx="32" cy="32" r="7.5" fill="none" stroke="#000" stroke-width=".8" opacity=".35"/>
  <circle cx="32" cy="32" r="3" fill="#000"/>
</svg>
